controller_manager:
  ros__parameters:
    update_rate: 50 # Hz

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    actuator_cont:
      type: joint_trajectory_controller/JointTrajectoryController

diff_cont:
  ros__parameters:
    publish_rate: 50.0
    use_stamped_vel: false
    open_loop: true
    cmd_vel_timeout: 0.25

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    command_topic: cmd_vel
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.0

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0
        min_velocity: -2.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0

actuator_cont:
  ros__parameters:
    joints:
      - elevator_joint        

    # El controlador de trayectoria ahora emite comandos de fuerza
    command_interfaces:
      - effort              
    
    state_interfaces:
      - position
      - velocity
      
    # PID gestionado por ROS 2
    # Ajsutar PID:
    # 1. Ajustar P hasta que el sistema oscile alrededor del objetivo
    # 2. Ajustar D hasta que el sistema deje de oscilar (normalente )
    # 3. Ajustar I hasta que el sistema alcance el objetivo sin error de estado estacionario
    gains:
      elevator_joint:
        p: 2000.0
        i: 10.0
        d: 50.0

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      elevator_joint:
        goal: 0.03